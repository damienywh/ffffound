<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ffffound archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav id="bar"><span class="wm">ffffound archive</span><div class="nav"><button id="bFold" title="Collections">⊞</button><button id="bTheme" title="Theme">◐</button></div></nav>
<main id="feed"></main>
<div id="sentinel"></div>
<button id="loadMore" title="Load more">↻</button>
<div id="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div id="vw"><div id="vwBg"></div><img id="vwImg" alt=""><div id="vwBar"><button id="vL" class="vb" title="Like (f)">♥</button><button id="vD" class="vb" title="Dislike (x)">×</button><button id="vS" class="vb" title="Save (s)">⊞</button><a id="vO" class="vb" target="_blank" rel="noopener" title="Original (o)">↓</a><button id="vP" class="vb vn" title="Prev">‹</button><button id="vN" class="vb vn" title="Next">›</button></div><div id="vwSt"></div></div>
<div id="sm"><div class="mbg"></div><div class="mbox"><div class="mhd"><span>save to collection</span><button id="smX">×</button></div><div id="fl"></div><div class="mnw"><input id="nfi" type="text" placeholder="new collection name" maxlength="40"><button id="nfb">+</button></div></div></div>
<div id="pn"><div class="pnBg"></div><div class="pnC"><div class="pnH"><span>collections</span><button id="pnX">×</button></div><div class="pnU" id="pnU"></div><div id="pl"></div><div class="pnF"><button id="pnBk" class="off">← back</button><div class="pa"><button id="expB">export</button><label class="fl">import<input type="file" id="impI" accept="application/json" hidden></label></div></div></div></div>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
